name: Publish previews

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push waits and then publishes the latest files.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site (adds noindex to every page)
        run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  # After the site is live, create a MarkUp for each new email and save the
  # links in markups.json. Edits to an email reuse its MarkUp.
  markups:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create a MarkUp for each new email
        env:
          MARKUP_API_KEY: ${{ secrets.MARKUP_API_KEY }}
        run: node scripts/create-markups.mjs
      - name: Save MarkUp links
        if: ${{ !cancelled() }}
        run: |
          if git diff --quiet -- markups.json; then echo "No new MarkUp links."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          git add markups.json
          git commit -m "Record MarkUp links [skip ci]"
          git pull --rebase
          git push
